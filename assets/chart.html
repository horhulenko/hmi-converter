<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  @font-face {
    font-family: "App";
    font-weight: 400;
    src: url(data:font/ttf;base64,/*__FONT_REGULAR__*/) format("truetype");
  }
  @font-face {
    font-family: "App";
    font-weight: 700;
    src: url(data:font/ttf;base64,/*__FONT_BOLD__*/) format("truetype");
  }
  :root {
    --bg: #111418;
    --surface: #171b21;
    --raised: #1f242c;
    --edge: #2a3039;
    --text: #e9edf2;
    --muted: #9aa4b2;
    --dim: #5d6673;
    --accent: #0b8ddc;
    --accent-deep: #082c50;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "App", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 18px 24px 14px;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 16px;
    flex: none;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 13px; }

  .bar {
    padding: 0 24px 14px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    flex: none;
  }
  .seg {
    display: flex; flex-wrap: wrap; gap: 2px;
    background: var(--surface); border-radius: 8px; padding: 3px;
  }
  .seg button {
    background: transparent;
    color: var(--muted);
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .seg button:hover { color: var(--text); background: var(--raised); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .opt { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .opt input { accent-color: var(--accent); margin: 0; }
  select {
    background: var(--raised); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px;
  }

  .body { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--edge); }
  aside {
    width: 300px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 0; background: var(--surface);
  }
  .side-top { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  #search {
    background: var(--bg); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 7px 10px; font: inherit;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #search::placeholder { color: var(--dim); }
  .side-row { display: flex; align-items: center; gap: 4px; }
  .side-row button {
    background: transparent; color: var(--muted); border: 0;
    border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .side-row button:hover { color: var(--text); background: var(--raised); }
  .side-row .count { color: var(--dim); font-size: 13px; margin-left: auto; }

  #list { overflow-y: auto; padding: 0 8px 12px; flex: 1; min-height: 0; }
  .item {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 5px 6px; border-radius: 6px; cursor: pointer;
  }
  .item:hover { background: var(--raised); }
  .item input { accent-color: var(--accent); flex: none; margin: 3px 0 0; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; margin-top: 5px; }
  .item span.name { font-size: 13px; overflow-wrap: anywhere; }
  .item.off span.name { color: var(--dim); }
  .item.off .swatch { opacity: .3; }

  main { flex: 1; min-width: 0; position: relative; }
  #chart { position: absolute; inset: 0; }
  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; color: var(--muted);
  }
  #tip {
    position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5;
    background: rgba(23, 27, 33, .97); border: 1px solid var(--edge); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; min-width: 220px; max-width: 460px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
  }
  #tip .when { color: var(--muted); margin-bottom: 6px; }
  #tip .row { display: flex; gap: 10px; align-items: baseline; }
  #tip .row i { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
  #tip .row span { flex: 1; overflow-wrap: anywhere; }
  #tip .row em { color: var(--dim); font-style: normal; margin-left: 6px; white-space: nowrap; }
  #tip .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #tip .more { color: var(--dim); margin-top: 4px; }
  footer {
    flex: none; padding: 8px 24px; border-top: 1px solid var(--edge);
    color: var(--dim); font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="bar">
  <div class="seg" id="types"></div>
  <label class="opt"><input type="checkbox" id="log"> Logarithmisch</label>
  <label class="opt"><input type="checkbox" id="norm"> Normiert 0–100 %</label>
  <label class="opt"><input type="checkbox" id="smooth"> Geglättet</label>
  <span class="opt" id="xy" hidden>
    X <select id="xsel"></select>
    Y <select id="ysel"></select>
  </span>
  <span class="opt" id="binsWrap" hidden>
    Klassen <select id="bins"><option>10</option><option selected>20</option><option>40</option><option>80</option></select>
  </span>
</div>

<div class="body">
  <aside>
    <div class="side-top">
      <input id="search" placeholder="Tags filtern …" autocomplete="off">
      <div class="side-row">
        <button id="all">Alle</button>
        <button id="none">Keine</button>
        <button id="invert">Umkehren</button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="chart"></div>
    <div id="tip" hidden></div>
    <div id="empty">Links mindestens einen Tag auswählen.</div>
  </main>
</div>

<footer id="foot"></footer>

<script>/*__ECHARTS__*/</script>
<script>
const PAYLOAD = /*__PAYLOAD__*/;

// ---------------------------------------------------------------- setup

const ACCENT = '#0b8ddc';
const ACCENT_DEEP = '#082c50';
const FONT = '"App", "Segoe UI", system-ui, sans-serif';

const S = PAYLOAD.series;
// A spread of hues, so a hundred tags still tell each other apart.
const colours = S.map((_, i) => {
  const golden = 137.508;
  const hue = (i * golden) % 360;
  const light = 58 + ((i % 3) - 1) * 9;
  const sat = 68 + ((i % 2) * 12);
  return `hsl(${hue.toFixed(1)} ${sat}% ${light}%)`;
});

const TYPES = [
  ['line',    'Linien'],
  ['area',    'Fläche'],
  ['stack',   'Gestapelt'],
  ['step',    'Stufen'],
  ['scatter', 'Punkte'],
  ['bar',     'Balken'],
  ['multi',   'Einzeln'],
  ['heat',    'Heatmap'],
  ['hist',    'Histogramm'],
  ['box',     'Boxplot'],
  ['xy',      'Korrelation'],
];
/** The kinds drawn against one shared time axis. */
const OVER_TIME = ['line', 'area', 'stack', 'step', 'scatter', 'bar'];

const state = {
  type: 'line',
  log: false,
  norm: false,
  smooth: false,
  on: new Set(S.map((_, i) => i)),
  bins: 20,
  x: 0,
  y: Math.min(1, S.length - 1),
};

// Only the busiest tags are on at the start, or a hundred lines hide each other.
if (S.length > 12) {
  const busiest = S.map((s, i) => [i, s.data.length])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(p => p[0]);
  state.on = new Set(busiest);
}

const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
addEventListener('resize', () => chart.resize());

document.getElementById('meta').textContent = PAYLOAD.meta;
document.getElementById('foot').textContent = PAYLOAD.foot;

// ---------------------------------------------------------------- numbers

const fmtWhole = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 3 });
const fmtSmall = new Intl.NumberFormat('de-DE', { maximumSignificantDigits: 3 });
/** A value as it is read aloud: `0,009`, `1,392`, `1.234,5` -- never `9e-3`. */
const num = v => (v !== 0 && Math.abs(v) < 1) ? fmtSmall.format(v) : fmtWhole.format(v);

function stamp(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getUTCDate())}.${p(d.getUTCMonth() + 1)}.${d.getUTCFullYear()} ` +
         `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
}

// ---------------------------------------------------------------- controls

const typeBar = document.getElementById('types');
for (const [key, label] of TYPES) {
  const b = document.createElement('button');
  b.textContent = label;
  b.dataset.type = key;
  b.setAttribute('aria-pressed', key === state.type);
  b.onclick = () => {
    state.type = key;
    for (const other of typeBar.children) {
      other.setAttribute('aria-pressed', other.dataset.type === key);
    }
    syncControls();
    render(true);
  };
  typeBar.append(b);
}

for (const [id, key] of [['log', 'log'], ['norm', 'norm'], ['smooth', 'smooth']]) {
  document.getElementById(id).onchange = e => { state[key] = e.target.checked; render(true); };
}
document.getElementById('bins').onchange = e => { state.bins = +e.target.value; render(true); };

for (const [id, sel] of [['xsel', 'x'], ['ysel', 'y']]) {
  const el = document.getElementById(id);
  S.forEach((s, i) => el.append(new Option(s.name, i)));
  el.value = state[sel];
  el.onchange = e => { state[sel] = +e.target.value; render(true); };
}

function syncControls() {
  const t = state.type;
  document.getElementById('xy').hidden = t !== 'xy';
  document.getElementById('binsWrap').hidden = !(t === 'hist' || t === 'heat');
  // Normalising only means something when series share one axis.
  document.getElementById('norm').parentElement.style.opacity =
    [...OVER_TIME, 'multi'].includes(t) ? 1 : .4;
}

// ---------------------------------------------------------------- tag list

const list = document.getElementById('list');
const items = S.map((s, i) => {
  const row = document.createElement('label');
  row.className = 'item';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = state.on.has(i);
  const dot = document.createElement('span');
  dot.className = 'swatch';
  dot.style.background = colours[i];
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = s.name;
  name.title = `${s.name} – ${fmtWhole.format(s.data.length)} Punkte`;
  row.append(box, dot, name);
  box.onchange = () => {
    if (box.checked) state.on.add(i); else state.on.delete(i);
    row.classList.toggle('off', !box.checked);
    updateCount();
    render(false);
  };
  row.classList.toggle('off', !box.checked);
  list.append(row);
  return { row, box, name: s.name.toLowerCase() };
});

function updateCount() {
  document.getElementById('count').textContent = `${state.on.size} von ${S.length}`;
}

function setAll(fn) {
  items.forEach((it, i) => {
    if (it.row.hidden) return;
    const want = fn(state.on.has(i));
    it.box.checked = want;
    it.row.classList.toggle('off', !want);
    if (want) state.on.add(i); else state.on.delete(i);
  });
  updateCount();
  render(false);
}
document.getElementById('all').onclick = () => setAll(() => true);
document.getElementById('none').onclick = () => setAll(() => false);
document.getElementById('invert').onclick = () => setAll(v => !v);

document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  items.forEach(it => { it.row.hidden = q && !it.name.includes(q); });
};

// ---------------------------------------------------------------- helpers

const chosen = () => [...state.on].sort((a, b) => a - b);

/** Values of one series, ready to draw: normalised and log-safe as asked. */
function points(i) {
  let d = S[i].data;
  if (state.norm) {
    let lo = Infinity, hi = -Infinity;
    for (const [, v] of d) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const span = hi - lo;
    d = d.map(([t, v]) => [t, span ? ((v - lo) / span) * 100 : 50]);
  }
  // A log axis cannot show zero or less, so those points are left out.
  if (state.log) d = d.filter(p => p[1] > 0);
  return d;
}

const axisLabel = { color: '#9aa4b2', fontSize: 11, fontFamily: FONT };
const valueLabel = { ...axisLabel, formatter: v => num(v) };
/** German dates on the time axis: `07.10.` at midnight, `14:00` in between. */
const timeLabel = {
  ...axisLabel,
  hideOverlap: true,
  formatter: {
    year: '{yyyy}', month: '{MM}.{yyyy}', day: '{dd}.{MM}.',
    hour: '{HH}:{mm}', minute: '{HH}:{mm}', second: '{HH}:{mm}:{ss}',
    millisecond: '{HH}:{mm}:{ss},{SSS}', none: '{HH}:{mm}:{ss}',
  },
};
const axisLine = { lineStyle: { color: '#2a3039' } };
const splitLine = { lineStyle: { color: '#1f242c' } };

function baseGrid(extra) {
  return Object.assign({ left: 72, right: 28, top: 22, bottom: 76, containLabel: false }, extra);
}

const zoom = [
  { type: 'inside', throttle: 30 },
  {
    type: 'slider', height: 24, bottom: 16, showDetail: false,
    backgroundColor: '#171b21', borderColor: '#2a3039',
    fillerColor: 'rgba(11,141,220,.18)',
    handleStyle: { color: ACCENT, borderColor: ACCENT },
    moveHandleStyle: { color: ACCENT_DEEP },
    textStyle: { color: '#9aa4b2', fontSize: 11 },
    dataBackground: { lineStyle: { color: '#3a4250' }, areaStyle: { color: '#1f242c' } },
    selectedDataBackground: { lineStyle: { color: ACCENT }, areaStyle: { color: ACCENT_DEEP } },
  },
];

const tooltipBox = {
  backgroundColor: 'rgba(23,27,33,.97)',
  borderColor: '#2a3039',
  textStyle: { color: '#e9edf2', fontSize: 12, fontFamily: FONT },
  extraCssText: 'max-height:60vh;overflow:auto;box-shadow:0 8px 28px rgba(0,0,0,.45)',
};

/** What is on the chart right now, so the readout uses the same numbers. */
const DRAWN = new Map();

/** The last reading of a series at or before `t`.
 *
 *  The tags do not log in step with each other, so asking for "the value at
 *  this instant" means the reading that still stands -- which is what the HMI
 *  itself holds between entries. A binary search, so the readout keeps up
 *  with the mouse however many points there are. */
function valueAt(pts, t) {
  if (!pts || !pts.length || t < pts[0][0]) return null;
  let lo = 0, hi = pts.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (pts[mid][0] <= t) lo = mid; else hi = mid - 1;
  }
  return pts[lo];
}

// ---------------------------------------------------------------- readout
//
// The crosshair follows the mouse exactly. ECharts' own axis tooltip snaps to
// the nearest data point of some series -- with tags that log rarely that is
// far from the pointer, and finding it scans every point on every move. So
// the pointer lines are drawn without snapping, and the list of values beside
// them is built here from the time under the mouse.

const tip = document.getElementById('tip');
let pointer = null;
/** The time the crosshair stands at, as ECharts reports it -- so the list
 *  and the label on the axis always name the same instant. */
let pointerT = null;
let frame = 0;

function readoutHtml(t) {
  const found = [];
  for (const i of chosen()) {
    const hit = valueAt(DRAWN.get(i), t);
    if (hit) found.push({ i, v: hit[1], at: hit[0] });
  }
  if (!found.length) return '';
  found.sort((a, b) => b.v - a.v);

  const LIMIT = 24;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const rows = found.slice(0, LIMIT).map(f => {
    // A reading much older than the pointer is one that still stands.
    const held = t - f.at > 60000 ? '<em>gehalten</em>' : '';
    return `<div class="row"><i style="background:${colours[f.i]}"></i>` +
      `<span>${esc(S[f.i].name)}${held}</span><b>${num(f.v)}</b></div>`;
  }).join('');
  const more = found.length > LIMIT
    ? `<div class="more">und ${found.length - LIMIT} weitere</div>` : '';
  return `<div class="when">${stamp(t)}</div>${rows}${more}`;
}

function drawReadout() {
  frame = 0;
  const live = pointer && OVER_TIME.includes(state.type) && state.on.size &&
    chart.containPixel({ gridIndex: 0 }, pointer);
  if (!live) { tip.hidden = true; return; }
  const t = pointerT != null ? pointerT : chart.convertFromPixel({ xAxisIndex: 0 }, pointer[0]);
  const html = readoutHtml(t);
  if (!html) { tip.hidden = true; return; }
  tip.innerHTML = html;
  tip.hidden = false;

  // Beside the pointer, on whichever side has room.
  const box = tip.parentElement.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = pointer[0] + 18;
  if (x + w > box.width - 8) x = pointer[0] - w - 18;
  let y = pointer[1] + 18;
  if (y + h > box.height - 8) y = Math.max(8, box.height - h - 8);
  tip.style.transform = `translate(${Math.max(8, x)}px, ${y}px)`;
}

chart.getZr().on('mousemove', e => {
  pointer = [e.offsetX, e.offsetY];
  if (!frame) frame = requestAnimationFrame(drawReadout);
});
chart.getZr().on('globalout', () => { pointer = null; pointerT = null; tip.hidden = true; });
chart.on('updateAxisPointer', ev => {
  const x = (ev.axesInfo || []).find(a => a.axisDim === 'x');
  pointerT = x ? +x.value : null;
  if (pointer && !frame) frame = requestAnimationFrame(drawReadout);
});
chart.on('dataZoom', () => { if (pointer && !frame) frame = requestAnimationFrame(drawReadout); });

/** Pointer lines that sit exactly under the mouse. */
const freePointer = (label) => ({
  show: true, snap: false, triggerTooltip: false, type: 'line',
  lineStyle: { color: ACCENT, width: 1, type: 'solid', opacity: .8 },
  label: { show: true, backgroundColor: ACCENT, color: '#fff', fontFamily: FONT,
           fontSize: 11, padding: [4, 7], borderRadius: 4, formatter: label },
});

// ---------------------------------------------------------------- the charts

function optionTime() {
  const ids = chosen();
  DRAWN.clear();
  for (const i of ids) DRAWN.set(i, points(i));
  const stacked = state.type === 'stack';
  const isScatter = state.type === 'scatter';
  const isBar = state.type === 'bar';
  return {
    animationDuration: 380,
    animationEasing: 'cubicOut',
    grid: baseGrid(),
    tooltip: { show: true, trigger: 'none', showContent: false },
    xAxis: {
      type: 'time', axisLabel: timeLabel, axisLine, splitLine: { show: false },
      axisPointer: freePointer(p => stamp(p.value)),
    },
    yAxis: {
      type: state.log ? 'log' : 'value',
      name: state.norm ? '%' : '',
      nameTextStyle: { color: '#9aa4b2' },
      axisLabel: valueLabel, axisLine, splitLine, scale: !state.log,
      axisPointer: { ...freePointer(p => num(p.value)),
                     lineStyle: { color: ACCENT, width: 1, type: 'dashed', opacity: .5 } },
    },
    dataZoom: zoom,
    series: ids.map(i => ({
      id: 'e' + i,
      name: S[i].name,
      type: isScatter ? 'scatter' : (isBar ? 'bar' : 'line'),
      data: DRAWN.get(i),
      color: colours[i],
      symbol: isScatter ? 'circle' : 'none',
      symbolSize: isScatter ? 4 : 0,
      step: state.type === 'step' ? 'end' : false,
      smooth: state.smooth && !isScatter,
      stack: stacked ? 'total' : undefined,
      areaStyle: (state.type === 'area' || stacked)
        ? { opacity: stacked ? .75 : .18 } : undefined,
      lineStyle: { width: 1.4 },
      large: true,
      largeThreshold: 2000,
      sampling: 'lttb',
      silent: true,
    })),
  };
}

/** One small chart per tag, so a hundred tags can be skimmed at a glance. */
function optionMultiples() {
  const ids = chosen();
  const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(ids.length))));
  const rows = Math.ceil(ids.length / cols);
  const grid = [], xAxis = [], yAxis = [], series = [], titles = [];
  const padX = 3.0, padY = 7.0;
  ids.forEach((id, k) => {
    const c = k % cols, r = Math.floor(k / cols);
    grid.push({
      left: `${padX + c * (100 - padX * 2) / cols}%`,
      top: `${6 + r * (94 / rows)}%`,
      width: `${(100 - padX * 2) / cols - padX}%`,
      height: `${94 / rows - padY}%`,
    });
    titles.push({
      text: S[id].name, left: `${padX + c * (100 - padX * 2) / cols}%`,
      top: `${6 + r * (94 / rows) - 4.2}%`,
      textStyle: { color: colours[id], fontSize: 11, fontWeight: 400, fontFamily: FONT },
    });
    xAxis.push({
      type: 'time', gridIndex: k, splitNumber: 2,
      axisLabel: { ...timeLabel, fontSize: 9, showMinLabel: false, showMaxLabel: false },
      axisLine, splitLine: { show: false },
    });
    yAxis.push({
      type: state.log ? 'log' : 'value', gridIndex: k, scale: !state.log, splitNumber: 3,
      axisLabel: { ...valueLabel, fontSize: 9, hideOverlap: true }, axisLine, splitLine,
    });
    series.push({
      id: 'm' + id, name: S[id].name, type: 'line', xAxisIndex: k, yAxisIndex: k,
      data: points(id), color: colours[id], symbol: 'none', smooth: state.smooth,
      lineStyle: { width: 1.2 }, areaStyle: { opacity: .12 },
      large: true, sampling: 'lttb',
    });
  });
  return {
    animationDuration: 340,
    title: titles,
    tooltip: { trigger: 'axis', ...tooltipBox,
      axisPointer: { lineStyle: { color: ACCENT } },
      formatter: ps => ps.length
        ? `<div style="color:#9aa4b2">${stamp(ps[0].value[0])}</div>
           ${ps[0].marker} ${ps[0].seriesName} <b>${num(ps[0].value[1])}</b>` : '' },
    grid, xAxis, yAxis, series,
  };
}

/** Time across, tags down, colour for the value. Good for spotting when
 *  something moved without knowing which tag to look at. */
function optionHeat() {
  const ids = chosen();
  const buckets = state.bins * 4;
  const t0 = PAYLOAD.from, t1 = PAYLOAD.to;
  const width = Math.max(1, (t1 - t0) / buckets);
  const data = [];
  ids.forEach((id, row) => {
    const sums = new Array(buckets).fill(0), counts = new Array(buckets).fill(0);
    for (const [t, v] of S[id].data) {
      const b = Math.min(buckets - 1, Math.max(0, Math.floor((t - t0) / width)));
      sums[b] += v; counts[b]++;
    }
    // Each row is scaled to itself, or one big tag would flatten the rest.
    let lo = Infinity, hi = -Infinity;
    for (let b = 0; b < buckets; b++) {
      if (!counts[b]) continue;
      const m = sums[b] / counts[b];
      if (m < lo) lo = m; if (m > hi) hi = m;
    }
    const span = hi - lo;
    for (let b = 0; b < buckets; b++) {
      if (!counts[b]) continue;
      const m = sums[b] / counts[b];
      data.push([b, row, span ? ((m - lo) / span) * 100 : 50, m]);
    }
  });
  return {
    animationDuration: 340,
    grid: baseGrid({ left: 220, bottom: 80, top: 16 }),
    tooltip: {
      ...tooltipBox,
      formatter: p => `<div style="color:#9aa4b2">${stamp(t0 + p.value[0] * width)}</div>
        ${S[ids[p.value[1]]].name} <b>${num(p.value[3])}</b>
        <div style="color:#9aa4b2">${p.value[2].toFixed(0)} % des Bereichs dieses Tags</div>`,
    },
    xAxis: {
      type: 'category', data: Array.from({ length: buckets }, (_, b) => t0 + b * width),
      axisLabel: { ...axisLabel, formatter: v => stamp(+v).slice(11, 16) },
      axisLine, splitArea: { show: false },
    },
    yAxis: {
      type: 'category', data: ids.map(i => S[i].name),
      axisLabel: { ...axisLabel, fontSize: 10 }, axisLine,
    },
    visualMap: {
      min: 0, max: 100, calculable: true, orient: 'horizontal',
      left: 'center', bottom: 12, textStyle: { color: '#9aa4b2' },
      inRange: { color: ['#111418', ACCENT_DEEP, ACCENT, '#bfe6ff'] },
    },
    series: [{ type: 'heatmap', data, progressive: 4000,
               emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } } }],
  };
}

/** How often each value occurs: the shape of the signal, not its history. */
function optionHist() {
  const ids = chosen();
  const bins = state.bins;
  const series = ids.map(id => {
    const vs = S[id].data.map(p => p[1]);
    let lo = Infinity, hi = -Infinity;
    for (const v of vs) { if (v < lo) lo = v; if (v > hi) hi = v; }
    if (lo === hi) { lo -= .5; hi += .5; }
    const w = (hi - lo) / bins;
    const counts = new Array(bins).fill(0);
    for (const v of vs) counts[Math.min(bins - 1, Math.floor((v - lo) / w))]++;
    return {
      id: 'h' + id, name: S[id].name, type: 'bar', color: colours[id],
      data: counts.map((c, b) => [lo + (b + .5) * w, c]),
      barMaxWidth: 26, itemStyle: { opacity: .8 },
      emphasis: { focus: 'series' },
    };
  });
  return {
    animationDuration: 380,
    grid: baseGrid({ bottom: 48 }),
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, ...tooltipBox,
      formatter: ps => ps.map(p =>
        `${p.marker} ${p.seriesName} um <b>${num(p.value[0])}</b>: ${fmtWhole.format(p.value[1])}`).join('<br>') },
    xAxis: { type: 'value', name: 'Wert', nameTextStyle: { color: '#9aa4b2' },
             axisLabel: valueLabel, axisLine, splitLine: { show: false }, scale: true },
    yAxis: { type: state.log ? 'log' : 'value', name: 'Anzahl',
             nameTextStyle: { color: '#9aa4b2' }, axisLabel: valueLabel, axisLine, splitLine },
    series,
  };
}

/** Median, quartiles and reach of each tag, side by side. */
function optionBox() {
  const ids = chosen();
  const quart = vs => {
    const at = q => {
      const pos = (vs.length - 1) * q, base = Math.floor(pos), rest = pos - base;
      return vs[base + 1] !== undefined ? vs[base] + rest * (vs[base + 1] - vs[base]) : vs[base];
    };
    return [vs[0], at(.25), at(.5), at(.75), vs[vs.length - 1]];
  };
  const data = ids.map(id => quart(S[id].data.map(p => p[1]).sort((a, b) => a - b)));
  return {
    animationDuration: 380,
    grid: baseGrid({ bottom: 130 }),
    tooltip: { trigger: 'item', ...tooltipBox,
      formatter: p => `<b>${S[ids[p.dataIndex]].name}</b><br>
        Minimum ${num(p.value[1])}<br>unteres Quartil ${num(p.value[2])}<br>
        Median ${num(p.value[3])}<br>oberes Quartil ${num(p.value[4])}<br>
        Maximum ${num(p.value[5])}` },
    xAxis: { type: 'category', data: ids.map(i => S[i].name),
             axisLabel: { ...axisLabel, rotate: 38, fontSize: 10 }, axisLine },
    yAxis: { type: state.log ? 'log' : 'value', scale: !state.log,
             axisLabel: valueLabel, axisLine, splitLine },
    series: [{ type: 'boxplot', data,
               itemStyle: { color: 'rgba(11,141,220,.25)', borderColor: ACCENT },
               emphasis: { itemStyle: { borderColor: '#fff' } } }],
  };
}

/** One tag against another, to see whether they move together. */
function optionXY() {
  const a = S[state.x], b = S[state.y];
  // Pair them on the nearest timestamp: the two tags rarely log in step.
  const pairs = [];
  let j = 0;
  for (const [t, va] of a.data) {
    while (j + 1 < b.data.length && Math.abs(b.data[j + 1][0] - t) <= Math.abs(b.data[j][0] - t)) j++;
    if (b.data[j]) pairs.push([va, b.data[j][1], t]);
  }
  return {
    animationDuration: 380,
    grid: baseGrid({ bottom: 96, left: 84 }),
    tooltip: { trigger: 'item', ...tooltipBox,
      formatter: p => `<div style="color:#9aa4b2">${stamp(p.value[2])}</div>
        ${a.name} <b>${num(p.value[0])}</b><br>${b.name} <b>${num(p.value[1])}</b>` },
    xAxis: { type: state.log ? 'log' : 'value', name: a.name, nameLocation: 'middle',
             nameGap: 30, nameTextStyle: { color: '#9aa4b2' },
             axisLabel: valueLabel, axisLine, splitLine, scale: true },
    yAxis: { type: state.log ? 'log' : 'value', name: b.name, nameLocation: 'middle',
             nameGap: 56, nameTextStyle: { color: '#9aa4b2' },
             axisLabel: valueLabel, axisLine, splitLine, scale: true },
    visualMap: {
      dimension: 2, min: PAYLOAD.from, max: PAYLOAD.to, calculable: true,
      orient: 'horizontal', left: 'center', bottom: 10, precision: 0,
      text: ['später', 'früher'], textStyle: { color: '#9aa4b2' },
      inRange: { color: [ACCENT_DEEP, ACCENT, '#bfe6ff'] },
      formatter: v => stamp(v).slice(11, 16),
    },
    series: [{ type: 'scatter', data: pairs, symbolSize: 5,
               large: true, largeThreshold: 2000, progressive: 5000 }],
  };
}

// ---------------------------------------------------------------- drawing

function render(hard) {
  const ids = chosen();
  const needsTags = state.type !== 'xy';
  document.getElementById('empty').style.display =
    (needsTags && ids.length === 0) ? 'flex' : 'none';
  tip.hidden = true;
  if (needsTags && ids.length === 0) { chart.clear(); return; }

  let option;
  switch (state.type) {
    case 'multi': option = optionMultiples(); break;
    case 'heat':  option = optionHeat(); break;
    case 'hist':  option = optionHist(); break;
    case 'box':   option = optionBox(); break;
    case 'xy':    option = optionXY(); break;
    default:      option = optionTime();
  }
  option.useUTC = true;
  option.textStyle = { fontFamily: FONT };
  // A softer update keeps the zoom, but the series list is still replaced,
  // so a tag switched off really leaves the chart.
  chart.setOption(option, hard
    ? { notMerge: true }
    : { replaceMerge: ['series', 'title', 'grid', 'xAxis', 'yAxis'] });
}

updateCount();
syncControls();
// The canvas measures its text once, so the font has to be there first.
const ready = document.fonts ? document.fonts.load('12px "App"') : Promise.resolve();
ready.catch(() => {}).then(() => render(true));
</script>
</body>
</html>
