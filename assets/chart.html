<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #15181d;
    --card: #1d2128;
    --edge: #2f353f;
    --field: #282d36;
    --text: #e8ebf0;
    --muted: #9aa3b2;
    --dim: #5a6270;
    --accent: #6ea8ff;
    --accent-fill: #1f5fcc;
    --ok: #56d194;
    --warn: #f0be4b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--edge);
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex: none;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }

  .bar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    flex: none;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    background: var(--field);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 6px 11px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .seg button:hover { background: #333944; border-color: var(--accent); }
  .seg button[aria-pressed="true"] {
    background: var(--accent-fill);
    border-color: var(--accent);
    color: #fff;
  }
  .opt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .opt input { accent-color: var(--accent); }
  select {
    background: var(--field); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 5px 7px; font: inherit; font-size: 13px; max-width: 220px;
  }

  .body { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 288px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-top { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: none; }
  #search {
    background: #111418; color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  #search::placeholder { color: var(--dim); }
  .side-row { display: flex; align-items: center; gap: 6px; }
  .side-row button {
    background: var(--field); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .side-row button:hover { border-color: var(--accent); }
  .side-row .count { color: var(--muted); font-size: 12px; margin-left: auto; }

  #list { overflow-y: auto; padding: 0 6px 10px; flex: 1; min-height: 0; }
  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 6px; border-radius: 5px; cursor: pointer;
    transition: background .12s;
  }
  .item:hover { background: #232832; }
  .item input { accent-color: var(--accent); flex: none; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .item span.name {
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item.off span.name { color: var(--dim); }
  .item.off .swatch { opacity: .3; }

  main { flex: 1; min-width: 0; position: relative; }
  #chart { position: absolute; inset: 0; }
  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; color: var(--muted);
  }
  footer {
    flex: none; padding: 6px 16px; border-top: 1px solid var(--edge);
    color: var(--dim); font-size: 11.5px;
  }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="bar">
  <div class="seg" id="types"></div>
  <label class="opt"><input type="checkbox" id="log"> Log scale</label>
  <label class="opt"><input type="checkbox" id="norm"> Normalise 0-100%</label>
  <label class="opt"><input type="checkbox" id="smooth"> Smooth</label>
  <span class="opt" id="xy" hidden>
    X <select id="xsel"></select>
    Y <select id="ysel"></select>
  </span>
  <span class="opt" id="binsWrap" hidden>
    Buckets <select id="bins"><option>10</option><option selected>20</option><option>40</option><option>80</option></select>
  </span>
</div>

<div class="body">
  <aside>
    <div class="side-top">
      <input id="search" placeholder="filter tags..." autocomplete="off">
      <div class="side-row">
        <button id="all">All</button>
        <button id="none">None</button>
        <button id="invert">Invert</button>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="chart"></div>
    <div id="empty">Pick at least one tag on the left.</div>
  </main>
</div>

<footer id="foot"></footer>

<script>/*__ECHARTS__*/</script>
<script>
const PAYLOAD = /*__PAYLOAD__*/;

// ---------------------------------------------------------------- setup

const S = PAYLOAD.series;
// A spread of hues, so a hundred tags still tell each other apart.
const colours = S.map((_, i) => {
  const golden = 137.508;
  const hue = (i * golden) % 360;
  const light = 58 + ((i % 3) - 1) * 9;
  const sat = 68 + ((i % 2) * 12);
  return `hsl(${hue.toFixed(1)} ${sat}% ${light}%)`;
});

const TYPES = [
  ['line',    'Lines'],
  ['area',    'Area'],
  ['stack',   'Stacked'],
  ['step',    'Steps'],
  ['scatter', 'Scatter'],
  ['bar',     'Bars'],
  ['multi',   'Small multiples'],
  ['heat',    'Heatmap'],
  ['hist',    'Histogram'],
  ['box',     'Box plot'],
  ['xy',      'Correlation'],
];

const state = {
  type: 'line',
  log: false,
  norm: false,
  smooth: false,
  on: new Set(S.map((_, i) => i)),
  bins: 20,
  x: 0,
  y: Math.min(1, S.length - 1),
};

// Only the busiest tags are on at the start, or a hundred lines hide each other.
if (S.length > 12) {
  const busiest = S.map((s, i) => [i, s.data.length])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8)
    .map(p => p[0]);
  state.on = new Set(busiest);
}

const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
addEventListener('resize', () => chart.resize());

document.getElementById('meta').textContent = PAYLOAD.meta;
document.getElementById('foot').textContent = PAYLOAD.foot;

// ---------------------------------------------------------------- controls

const typeBar = document.getElementById('types');
for (const [key, label] of TYPES) {
  const b = document.createElement('button');
  b.textContent = label;
  b.dataset.type = key;
  b.setAttribute('aria-pressed', key === state.type);
  b.onclick = () => {
    state.type = key;
    for (const other of typeBar.children) {
      other.setAttribute('aria-pressed', other.dataset.type === key);
    }
    syncControls();
    render(true);
  };
  typeBar.append(b);
}

for (const [id, key] of [['log', 'log'], ['norm', 'norm'], ['smooth', 'smooth']]) {
  document.getElementById(id).onchange = e => { state[key] = e.target.checked; render(true); };
}
document.getElementById('bins').onchange = e => { state.bins = +e.target.value; render(true); };

for (const [id, sel] of [['xsel', 'x'], ['ysel', 'y']]) {
  const el = document.getElementById(id);
  S.forEach((s, i) => el.append(new Option(s.name, i)));
  el.value = state[sel];
  el.onchange = e => { state[sel] = +e.target.value; render(true); };
}

function syncControls() {
  const t = state.type;
  document.getElementById('xy').hidden = t !== 'xy';
  document.getElementById('binsWrap').hidden = !(t === 'hist' || t === 'heat');
  // Normalising only means something when series share one axis.
  document.getElementById('norm').parentElement.style.opacity =
    ['line', 'area', 'stack', 'step', 'bar', 'multi'].includes(t) ? 1 : .4;
}

// ---------------------------------------------------------------- tag list

const list = document.getElementById('list');
const items = S.map((s, i) => {
  const row = document.createElement('label');
  row.className = 'item';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = state.on.has(i);
  const dot = document.createElement('span');
  dot.className = 'swatch';
  dot.style.background = colours[i];
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = s.name;
  name.title = `${s.name} - ${s.data.length} points`;
  row.append(box, dot, name);
  box.onchange = () => {
    if (box.checked) state.on.add(i); else state.on.delete(i);
    row.classList.toggle('off', !box.checked);
    updateCount();
    render(false);
  };
  row.classList.toggle('off', !box.checked);
  list.append(row);
  return { row, box, name: s.name.toLowerCase() };
});

function updateCount() {
  document.getElementById('count').textContent = `${state.on.size} of ${S.length}`;
}

function setAll(fn) {
  items.forEach((it, i) => {
    if (it.row.hidden) return;
    const want = fn(state.on.has(i));
    it.box.checked = want;
    it.row.classList.toggle('off', !want);
    if (want) state.on.add(i); else state.on.delete(i);
  });
  updateCount();
  render(false);
}
document.getElementById('all').onclick = () => setAll(() => true);
document.getElementById('none').onclick = () => setAll(() => false);
document.getElementById('invert').onclick = () => setAll(v => !v);

document.getElementById('search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  items.forEach(it => { it.row.hidden = q && !it.name.includes(q); });
};

// ---------------------------------------------------------------- helpers

const chosen = () => [...state.on].sort((a, b) => a - b);

/** Values of one series, ready to draw: normalised and log-safe as asked. */
function points(i) {
  let d = S[i].data;
  if (state.norm) {
    let lo = Infinity, hi = -Infinity;
    for (const [, v] of d) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const span = hi - lo;
    d = d.map(([t, v]) => [t, span ? ((v - lo) / span) * 100 : 50]);
  }
  // A log axis cannot show zero or less, so those points are left out.
  if (state.log) d = d.filter(p => p[1] > 0);
  return d;
}

const axisLabel = { color: '#9aa3b2', fontSize: 11 };
const axisLine = { lineStyle: { color: '#2f353f' } };
const splitLine = { lineStyle: { color: '#232830' } };

function baseGrid(extra) {
  return Object.assign({ left: 62, right: 24, top: 18, bottom: 72, containLabel: false }, extra);
}

const zoom = [
  { type: 'inside', throttle: 40 },
  {
    type: 'slider', height: 22, bottom: 14, showDetail: false,
    backgroundColor: '#1a1e24', borderColor: '#2f353f',
    fillerColor: 'rgba(31,95,204,.25)', handleStyle: { color: '#6ea8ff' },
    textStyle: { color: '#9aa3b2', fontSize: 10 },
    dataBackground: { lineStyle: { color: '#3a4250' }, areaStyle: { color: '#232830' } },
  },
];

const tooltipBox = {
  backgroundColor: 'rgba(24,28,34,.96)',
  borderColor: '#2f353f',
  textStyle: { color: '#e8ebf0', fontSize: 12 },
  extraCssText: 'max-height:60vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.45)',
};

function stamp(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getUTCDate())}.${p(d.getUTCMonth() + 1)}.${d.getUTCFullYear()} ` +
         `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
}

const num = v => (Math.abs(v) >= 1000 || v === 0 || Math.abs(v) >= 0.01)
  ? (+v.toFixed(3)).toLocaleString('en-GB')
  : v.toExponential(2);

/** What is on the chart right now, so the tooltip reads the same numbers. */
const DRAWN = new Map();

/** The last reading of a series at or before `t`.
 *
 *  The tags do not log in step with each other, so asking for "the value at
 *  this instant" means the reading that still stands -- which is what the HMI
 *  itself holds between entries. */
function valueAt(points, t) {
  if (!points || !points.length || t < points[0][0]) return null;
  let lo = 0, hi = points.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (points[mid][0] <= t) lo = mid; else hi = mid - 1;
  }
  return points[lo];
}

/** The shared tooltip: every chosen tag at the instant under the pointer,
 *  largest first, the way a trend viewer reads one. */
const timeTooltip = {
  trigger: 'axis',
  axisPointer: { type: 'cross', lineStyle: { color: '#6ea8ff', width: 1 },
                 crossStyle: { color: '#6ea8ff' }, label: { backgroundColor: '#1f5fcc' } },
  ...tooltipBox,
  formatter(ps) {
    if (!ps.length) return '';
    const t = ps[0].axisValue != null ? +ps[0].axisValue : ps[0].value[0];

    const found = [];
    for (const i of chosen()) {
      const hit = valueAt(DRAWN.get(i), t);
      if (hit) found.push({ i, v: hit[1], at: hit[0] });
    }
    found.sort((a, b) => b.v - a.v);

    const LIMIT = 24;
    const rows = found.slice(0, LIMIT).map(f => {
      // A reading much older than the pointer is one that still stands.
      const held = t - f.at > 60000 ? ' <span style="color:#5a6270">held</span>' : '';
      return `<div style="display:flex;gap:10px;align-items:center">
        <span style="width:9px;height:9px;border-radius:2px;background:${colours[f.i]}"></span>
        <span style="flex:1">${S[f.i].name}${held}</span>
        <b style="font-variant-numeric:tabular-nums">${num(f.v)}</b></div>`;
    }).join('');
    const more = found.length > LIMIT
      ? `<div style="color:#5a6270;margin-top:3px">and ${found.length - LIMIT} more</div>` : '';

    return `<div style="margin-bottom:4px;color:#9aa3b2">${stamp(t)}</div>${rows}${more}`;
  },
};

// ---------------------------------------------------------------- the charts

function optionTime() {
  const ids = chosen();
  DRAWN.clear();
  for (const i of ids) DRAWN.set(i, points(i));
  const stacked = state.type === 'stack';
  const isScatter = state.type === 'scatter';
  const isBar = state.type === 'bar';
  return {
    animationDuration: 420,
    animationEasing: 'cubicOut',
    grid: baseGrid(),
    tooltip: timeTooltip,
    xAxis: { type: 'time', axisLabel, axisLine, splitLine: { show: false } },
    yAxis: {
      type: state.log ? 'log' : 'value',
      name: state.norm ? '%' : '',
      nameTextStyle: { color: '#9aa3b2' },
      axisLabel, axisLine, splitLine, scale: !state.log,
    },
    dataZoom: zoom,
    series: ids.map(i => ({
      id: 'e' + i,
      name: S[i].name,
      type: isScatter ? 'scatter' : (isBar ? 'bar' : 'line'),
      data: DRAWN.get(i),
      color: colours[i],
      symbol: isScatter ? 'circle' : 'none',
      symbolSize: isScatter ? 4 : 0,
      step: state.type === 'step' ? 'end' : false,
      smooth: state.smooth && !isScatter,
      stack: stacked ? 'total' : undefined,
      areaStyle: (state.type === 'area' || stacked)
        ? { opacity: stacked ? .75 : .18 } : undefined,
      lineStyle: { width: 1.4 },
      large: true,
      largeThreshold: 2000,
      sampling: 'lttb',
      emphasis: { focus: 'series', lineStyle: { width: 2.6 } },
    })),
  };
}

/** One small chart per tag, so a hundred tags can be skimmed at a glance. */
function optionMultiples() {
  const ids = chosen();
  const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(ids.length))));
  const rows = Math.ceil(ids.length / cols);
  const grid = [], xAxis = [], yAxis = [], series = [], titles = [];
  const padX = 3.0, padY = 7.0;
  ids.forEach((id, k) => {
    const c = k % cols, r = Math.floor(k / cols);
    grid.push({
      left: `${padX + c * (100 - padX * 2) / cols}%`,
      top: `${6 + r * (94 / rows)}%`,
      width: `${(100 - padX * 2) / cols - padX}%`,
      height: `${94 / rows - padY}%`,
    });
    titles.push({
      text: S[id].name, left: `${padX + c * (100 - padX * 2) / cols}%`,
      top: `${6 + r * (94 / rows) - 4.2}%`,
      textStyle: { color: colours[id], fontSize: 11, fontWeight: 500 },
    });
    xAxis.push({
      type: 'time', gridIndex: k, splitNumber: 2,
      axisLabel: { ...axisLabel, fontSize: 9, hideOverlap: true, showMinLabel: false,
                   showMaxLabel: false },
      axisLine, splitLine: { show: false },
    });
    yAxis.push({
      type: state.log ? 'log' : 'value', gridIndex: k, scale: !state.log, splitNumber: 3,
      axisLabel: { ...axisLabel, fontSize: 9, hideOverlap: true }, axisLine, splitLine,
    });
    series.push({
      id: 'm' + id, name: S[id].name, type: 'line', xAxisIndex: k, yAxisIndex: k,
      data: points(id), color: colours[id], symbol: 'none', smooth: state.smooth,
      lineStyle: { width: 1.2 }, areaStyle: { opacity: .12 },
      large: true, sampling: 'lttb',
    });
  });
  return {
    animationDuration: 380,
    title: titles,
    tooltip: { trigger: 'axis', ...tooltipBox,
      formatter: ps => ps.length
        ? `<div style="color:#9aa3b2">${stamp(ps[0].value[0])}</div>
           ${ps[0].marker} ${ps[0].seriesName} <b>${num(ps[0].value[1])}</b>` : '' },
    grid, xAxis, yAxis, series,
  };
}

/** Time across, tags down, colour for the value. Good for spotting when
 *  something moved without knowing which tag to look at. */
function optionHeat() {
  const ids = chosen();
  const buckets = state.bins * 4;
  const t0 = PAYLOAD.from, t1 = PAYLOAD.to;
  const width = Math.max(1, (t1 - t0) / buckets);
  const data = [];
  ids.forEach((id, row) => {
    const sums = new Array(buckets).fill(0), counts = new Array(buckets).fill(0);
    for (const [t, v] of S[id].data) {
      const b = Math.min(buckets - 1, Math.max(0, Math.floor((t - t0) / width)));
      sums[b] += v; counts[b]++;
    }
    // Each row is scaled to itself, or one big tag would flatten the rest.
    let lo = Infinity, hi = -Infinity;
    for (let b = 0; b < buckets; b++) {
      if (!counts[b]) continue;
      const m = sums[b] / counts[b];
      if (m < lo) lo = m; if (m > hi) hi = m;
    }
    const span = hi - lo;
    for (let b = 0; b < buckets; b++) {
      if (!counts[b]) continue;
      const m = sums[b] / counts[b];
      data.push([b, row, span ? ((m - lo) / span) * 100 : 50, m]);
    }
  });
  return {
    animationDuration: 380,
    grid: baseGrid({ left: 190, bottom: 78, top: 14 }),
    tooltip: {
      ...tooltipBox,
      formatter: p => `<div style="color:#9aa3b2">${stamp(t0 + p.value[0] * width)}</div>
        ${S[ids[p.value[1]]].name} <b>${num(p.value[3])}</b>
        <div style="color:#9aa3b2">${p.value[2].toFixed(0)}% of this tag's range</div>`,
    },
    xAxis: {
      type: 'category', data: Array.from({ length: buckets }, (_, b) => t0 + b * width),
      axisLabel: { ...axisLabel, formatter: v => stamp(+v).slice(11, 16) },
      axisLine, splitArea: { show: false },
    },
    yAxis: {
      type: 'category', data: ids.map(i => S[i].name),
      axisLabel: { ...axisLabel, fontSize: 10 }, axisLine,
    },
    visualMap: {
      min: 0, max: 100, calculable: true, orient: 'horizontal',
      left: 'center', bottom: 12, textStyle: { color: '#9aa3b2' },
      inRange: { color: ['#1b2a4a', '#1f5fcc', '#56d194', '#f0be4b', '#f27b7b'] },
    },
    series: [{ type: 'heatmap', data, progressive: 4000,
               emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } } }],
  };
}

/** How often each value occurs: the shape of the signal, not its history. */
function optionHist() {
  const ids = chosen();
  const bins = state.bins;
  const series = ids.map(id => {
    const vs = S[id].data.map(p => p[1]);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (lo === hi) { lo -= .5; hi += .5; }
    const w = (hi - lo) / bins;
    const counts = new Array(bins).fill(0);
    for (const v of vs) counts[Math.min(bins - 1, Math.floor((v - lo) / w))]++;
    return {
      id: 'h' + id, name: S[id].name, type: 'bar', color: colours[id],
      data: counts.map((c, b) => [lo + (b + .5) * w, c]),
      barMaxWidth: 26, itemStyle: { opacity: .8 },
      emphasis: { focus: 'series' },
    };
  });
  return {
    animationDuration: 420,
    grid: baseGrid({ bottom: 44 }),
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, ...tooltipBox,
      formatter: ps => ps.map(p =>
        `${p.marker} ${p.seriesName} around <b>${num(p.value[0])}</b>: ${p.value[1]}`).join('<br>') },
    xAxis: { type: 'value', name: 'value', nameTextStyle: { color: '#9aa3b2' },
             axisLabel, axisLine, splitLine: { show: false }, scale: true },
    yAxis: { type: state.log ? 'log' : 'value', name: 'count',
             nameTextStyle: { color: '#9aa3b2' }, axisLabel, axisLine, splitLine },
    series,
  };
}

/** Median, quartiles and reach of each tag, side by side. */
function optionBox() {
  const ids = chosen();
  const quart = vs => {
    const at = q => {
      const pos = (vs.length - 1) * q, base = Math.floor(pos), rest = pos - base;
      return vs[base + 1] !== undefined ? vs[base] + rest * (vs[base + 1] - vs[base]) : vs[base];
    };
    return [vs[0], at(.25), at(.5), at(.75), vs[vs.length - 1]];
  };
  const data = ids.map(id => quart(S[id].data.map(p => p[1]).sort((a, b) => a - b)));
  return {
    animationDuration: 420,
    grid: baseGrid({ bottom: 120 }),
    tooltip: { trigger: 'item', ...tooltipBox,
      formatter: p => `<b>${S[ids[p.dataIndex]].name}</b><br>
        lowest ${num(p.value[1])}<br>lower quarter ${num(p.value[2])}<br>
        middle ${num(p.value[3])}<br>upper quarter ${num(p.value[4])}<br>
        highest ${num(p.value[5])}` },
    xAxis: { type: 'category', data: ids.map(i => S[i].name),
             axisLabel: { ...axisLabel, rotate: 38, fontSize: 10 }, axisLine },
    yAxis: { type: state.log ? 'log' : 'value', scale: !state.log,
             axisLabel, axisLine, splitLine },
    series: [{ type: 'boxplot', data,
               itemStyle: { color: '#1f5fcc55', borderColor: '#6ea8ff' },
               emphasis: { itemStyle: { borderColor: '#56d194' } } }],
  };
}

/** One tag against another, to see whether they move together. */
function optionXY() {
  const a = S[state.x], b = S[state.y];
  // Pair them on the nearest timestamp: the two tags rarely log in step.
  const pairs = [];
  let j = 0;
  for (const [t, va] of a.data) {
    while (j + 1 < b.data.length && Math.abs(b.data[j + 1][0] - t) <= Math.abs(b.data[j][0] - t)) j++;
    if (b.data[j]) pairs.push([va, b.data[j][1], t]);
  }
  return {
    animationDuration: 420,
    grid: baseGrid({ bottom: 92 }),
    tooltip: { trigger: 'item', ...tooltipBox,
      formatter: p => `<div style="color:#9aa3b2">${stamp(p.value[2])}</div>
        ${a.name} <b>${num(p.value[0])}</b><br>${b.name} <b>${num(p.value[1])}</b>` },
    xAxis: { type: state.log ? 'log' : 'value', name: a.name, nameLocation: 'middle',
             nameGap: 30, nameTextStyle: { color: '#9aa3b2' },
             axisLabel, axisLine, splitLine, scale: true },
    yAxis: { type: state.log ? 'log' : 'value', name: b.name, nameLocation: 'middle',
             nameGap: 44, nameTextStyle: { color: '#9aa3b2' },
             axisLabel, axisLine, splitLine, scale: true },
    visualMap: {
      dimension: 2, min: PAYLOAD.from, max: PAYLOAD.to, calculable: true,
      orient: 'horizontal', left: 'center', bottom: 10, precision: 0,
      text: ['later', 'earlier'], textStyle: { color: '#9aa3b2' },
      inRange: { color: ['#1f5fcc', '#56d194', '#f0be4b'] },
      formatter: v => stamp(v).slice(11, 16),
    },
    series: [{ type: 'scatter', data: pairs, symbolSize: 5,
               large: true, largeThreshold: 2000, progressive: 5000 }],
  };
}

// ---------------------------------------------------------------- drawing

function render(hard) {
  const ids = chosen();
  const needsTags = state.type !== 'xy';
  document.getElementById('empty').style.display =
    (needsTags && ids.length === 0) ? 'flex' : 'none';
  if (needsTags && ids.length === 0) { chart.clear(); return; }

  let option;
  switch (state.type) {
    case 'multi': option = optionMultiples(); break;
    case 'heat':  option = optionHeat(); break;
    case 'hist':  option = optionHist(); break;
    case 'box':   option = optionBox(); break;
    case 'xy':    option = optionXY(); break;
    default:      option = optionTime();
  }
  option.useUTC = true;
  chart.setOption(option, { notMerge: !!hard, lazyUpdate: false });
}

updateCount();
syncControls();
render(true);
</script>
</body>
