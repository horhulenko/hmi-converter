name: Release

# Builds the program for Windows and Linux whenever a version tag (v1.0,
# v2.0, ...) is pushed, and attaches both to that tag's GitHub release.
#
# A tag made before this file existed can be built by hand:
#   Actions -> Release -> Run workflow -> tag: v1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, for example v1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: cargo build --release --locked

      # Packed, the program is about a third of its size. It unpacks itself
      # into memory when it starts, which takes a fraction of a second.
      - name: Pack with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: target/release/hmi-converter${{ runner.os == 'Windows' && '.exe' || '' }}
          args: --best --lzma

      - name: Package
        shell: bash
        run: |
          version="${TAG#v}"
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/hmi-converter.exe "dist/hmi-converter-${version}-windows-x86_64.exe"
          else
            tar -C target/release -czf "dist/hmi-converter-${version}-linux-x86_64.tar.gz" hmi-converter
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "HMI Log Converter ${TAG#v}" --generate-notes
          fi
